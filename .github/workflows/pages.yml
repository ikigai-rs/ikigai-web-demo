name: Build, smoke and deploy the demo

# Rebuild and redeploy the WASM demo whenever it changes. (To pick up a new
# release of an upstream ikigai crate, bump its version in Cargo.toml and push —
# that's a change here, so it redeploys.) Also runnable on demand.
#
# It ALSO runs on pull requests, without deploying. The `smoke` job below is the only
# gate that runs the wasm rather than compiling it, and a gate that first executes after
# merge is a gate that reports a broken demo instead of preventing one — which is exactly
# the twenty days of August this repo already spent. Running here on PRs costs a wasm
# build plus the module clones per PR and buys the check BEFORE the merge, not after.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Let Pages read the deployment token; one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write
# Keyed by ref, so concurrent PRs don't cancel each other — and main still serializes into
# one group, the single-deploy-at-a-time behaviour Pages needs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Pinned upstream module revisions.
#
# The two repos below are built FROM SOURCE into the deployed artifact, so cloning their
# default branch meant whatever landed upstream since the last deploy went onto the public
# site unreviewed and unbisectable — a change here with no commit here. Neither repo cuts
# tags or releases, so a commit SHA is the only immutable handle they offer; it is also the
# stronger one, since a tag can be force-moved and a SHA cannot.
#
# Each pin is the release commit of the version the NATIVE build locks (Cargo.lock), so the
# wasm modules and their native counterparts are the same code. They build without a lock
# (none of the three repos commits one), so each module resolves FRESH here — the reason the
# previous pins (xslt 0.1.1 / jsonld 0.1.1, on the ikigai-module 0.1.x line) stopped
# building once ikigai-core 0.1.78 made `Resolved` constructible only through
# `Resolved::new`: Pages was red from ~2026-09-27 until these moved (ledger #728).
#
# SHACL_REV was first the ikigai-shacl 0.2.0 release commit (shacl PR #12): the first release
# whose `module` feature builds for wasm32 at all (rudof >= 0.3.22, ledger #206). It is now the
# 0.3.3 release commit (shacl PR #22), the security floor: caller SPARQL in a shapes graph never
# reaches the network (0.3.2, ledger #1099, #1101), and a select whose WHERE rudof would misread
# is refused (0.3.3, ledger #1102). 0.3.3's other fix, validation on a sized pool rather than
# rayon's global workers, is native-only (on wasm rayon runs on the current thread); the move is
# for parity with the native lock (ledger #1121). XSLT_REV and JSONLD_REV moved with it to their 0.2.1
# release commits (the caller-input bounds of ledger #916 and #1042), so each module wasm is the
# code the native build locks, as above.
#
# XSLT_REV then moved to the 0.2.2 release commit (xslt PR #28, on its release-0.2 branch, not
# main): the 0.2.1 pin above was 1760b37, which is NOT the commit crates.io's 0.2.1 was cut from
# (1ce7c34) and asks for an uncapped `xrust = "2.1.0"`. 0.2.2 is cut from the pinned commit and
# caps xrust below 2.3 (ledger #1492, #1505). The xrust --precise step in the XSLT build below
# still pins the version this repo's Cargo.lock holds, which 0.2.2's range admits.
#
# To bump: replace the SHA, push, and let `smoke` vet the result. That is what it is for.
env:
  XSLT_REV: d843d323e09aca371cc2a5f12fd1ffdf79aa7327    # ikigai-xslt 0.2.2 (xslt PR #28, release-0.2)
  JSONLD_REV: 452fb1cef110c8941cc9b554e5c3285c37359c09  # ikigai-jsonld 0.2.1 (jsonld PR #11)
  SHACL_REV: c04d838f714f413b5c37e6cad69962482661e9b5   # ikigai-shacl 0.3.3 (shacl PR #22)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Prebuilt wasm-bindgen-cli, pinned to the version in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      # Rebuild the HOST wasm from the published crates and emit its JS bindings into
      # dist/. (--lib only: the native WebTransport server bin isn't part of the wasm
      # build.)
      - name: Build host WASM + JS bindings into dist/
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            target/wasm32-unknown-unknown/release/ikigai_web_demo.wasm

      # Build the lazy-loaded XSLT module wasm from the ikigai-xslt repo itself, with its
      # `module` feature (which emits the module glue via ikigai_module::wasm_module!) — so
      # xrust never enters the host's wasm; the host imports it lazily through the committed
      # dist/xslt-loader.js glue. Only the generated .js/.wasm are CI-built. Uses the same
      # wasm32 toolchain + wasm-bindgen-cli@0.2.108 installed above. (ikigai-xslt is its own
      # module now — there is no separate ikigai-xslt-module crate.)
      # `git fetch --depth 1 <sha>` keeps the shallow clone's cheapness while landing on an
      # exact revision; GitHub serves a SHA directly, so no full history is pulled. The
      # rev-parse check after it is belt-and-braces — a bad pin already fails the fetch, but
      # a silent landing anywhere other than XSLT_REV should stop the build, not deploy.
      - name: Build XSLT module WASM + JS bindings into dist/
        run: |
          git init -q module-src
          git -C module-src remote add origin https://github.com/ikigai-rs/ikigai-xslt.git
          git -C module-src fetch -q --depth 1 origin "$XSLT_REV"
          git -C module-src checkout -q FETCH_HEAD
          test "$(git -C module-src rev-parse HEAD)" = "$XSLT_REV"
          # Build against the xrust THIS repo's Cargo.lock holds, not a fresh resolve's.
          # ikigai-xslt asks for `xrust = "2.1.0"`, and xrust 2.3.0 (2026-10-13) broke it
          # inside that range: E0599 `populate_key_values`, E0533 `MissingNameSpace` became a
          # struct variant. The native build was never exposed (it is locked); the module wasm
          # resolved fresh and went red. Reading the version from Cargo.lock keeps the wasm
          # module on the code the native build locks, the parity the header above states.
          XRUST="$(grep -A1 '^name = "xrust"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          test -n "$XRUST"
          cargo generate-lockfile --manifest-path module-src/Cargo.toml
          cargo update --manifest-path module-src/Cargo.toml -p xrust --precise "$XRUST"
          cargo build --release --lib --features module \
            --manifest-path module-src/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            module-src/target/wasm32-unknown-unknown/release/ikigai_xslt.wasm

      # The JSON-LD operator module (urn:jsonld:*), built from its own repo with the `module`
      # feature, lazy-loaded via the committed dist/jsonld-loader.js — the heavy json-ld tree
      # kept out of the host wasm, exactly like XSLT.
      - name: Build JSON-LD module WASM + JS bindings into dist/
        run: |
          git init -q jsonld-src
          git -C jsonld-src remote add origin https://github.com/ikigai-rs/ikigai-jsonld.git
          git -C jsonld-src fetch -q --depth 1 origin "$JSONLD_REV"
          git -C jsonld-src checkout -q FETCH_HEAD
          test "$(git -C jsonld-src rev-parse HEAD)" = "$JSONLD_REV"
          cargo build --release --lib --features module \
            --manifest-path jsonld-src/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            jsonld-src/target/wasm32-unknown-unknown/release/ikigai_jsonld.wasm

      # The REAL ikigai-shacl crate (rudof) as a lazy module, loaded via the committed
      # dist/shacl-module-loader.js. The page serves `urn:shacl:validate` through it by
      # default; `?shacl=js` selects shacl-engine (JS) instead, for comparison. Same recipe
      # as the two modules above.
      - name: Build SHACL module WASM + JS bindings into dist/
        run: |
          git init -q shacl-src
          git -C shacl-src remote add origin https://github.com/ikigai-rs/ikigai-shacl.git
          git -C shacl-src fetch -q --depth 1 origin "$SHACL_REV"
          git -C shacl-src checkout -q FETCH_HEAD
          test "$(git -C shacl-src rev-parse HEAD)" = "$SHACL_REV"
          cargo build --release --lib --features module \
            --manifest-path shacl-src/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            shacl-src/target/wasm32-unknown-unknown/release/ikigai_shacl.wasm

      # Cache-bust the fixed-name host JS + wasm: rewrite the ?v=__BUILD__ placeholder in
      # index.html to this commit's SHA, so every deploy fetches fresh assets instead of a
      # (max-age=600) stale cached copy. The placeholder is harmless locally (a static
      # server ignores the query).
      - name: Stamp cache-busting build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA}/g" dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The same tree, as an ordinary artifact, so the `smoke` job below can RUN it. It
      # is handed over after the stamp so the smoke gate exercises the exact bytes that
      # deploy — not a re-build that might differ.
      - name: Hand dist/ to the smoke gate
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # The gate that RUNS the wasm instead of only compiling it.
  #
  # ci.yml checks fmt, clippy on the wasm lib, and clippy on all native targets. All three
  # are compile-only, and the failure this exists for is invisible to a compiler:
  # ikigai-time 0.1.12 stamped completed jobs with `std::time::Instant::now()`, which
  # compiles clean for wasm32-unknown-unknown and panics at runtime — while holding the
  # job-registry mutex, so every later `urn:time:*` read died `cannot recursively acquire
  # mutex`. `urn:time:jobs` is one of three sub-requests `urn:data:control-cards`
  # composes, so the public demo's Control panel was a bare header from 2026-08-12 to
  # 2026-09-01 with every check green the whole time.
  #
  # It runs on the built artifact rather than in-crate for a reason this workflow makes
  # plain: the deployed tree also contains ~400 lines of hand-written JS glue in
  # index.html (the /k/ fetch interception, the htmx adapter) that no Rust test can reach,
  # and two module wasms built above from pinned revisions of ikigai-xslt and
  # ikigai-jsonld, which nothing in this repo compiles or lints. Only a test over dist/ sees
  # any of that. (Those revisions were unpinned upstream HEAD until 2026-09-02; pinning
  # makes a module change deliberate, and this job is what vets the bump.)
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Take the built tree, not the committed one: dist/*.js and dist/*.wasm are
      # gitignored (CI-generated), so the checkout alone has no kernel to run.
      - name: Replace dist/ with the artifact that is about to deploy
        run: rm -rf dist

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smoke/package-lock.json

      - name: Install smoke deps
        working-directory: smoke
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('smoke/package-lock.json') }}

      - name: Install Chromium
        working-directory: smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built demo
        working-directory: smoke
        run: npx playwright test

      # A failure here blocks the deploy, so the trace is the thing that explains why.
      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke/test-results
          retention-days: 7

  deploy:
    # Gated on `smoke`, not just `build`: a tree that compiles but does not RUN never
    # reaches the public URL.
    needs: [build, smoke]
    # A pull request builds and smoke-tests; only main publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
