name: Deploy demo to GitHub Pages

# Rebuild and redeploy the WASM demo whenever it changes. (To pick up a new
# release of an upstream ikigai crate, bump its version in Cargo.toml and push —
# that's a change here, so it redeploys.) Also runnable on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Let Pages read the deployment token; one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Prebuilt wasm-bindgen-cli, pinned to the version in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      # Rebuild the HOST wasm from the published crates and emit its JS bindings into
      # dist/. (--lib only: the native WebTransport server bin isn't part of the wasm
      # build.)
      - name: Build host WASM + JS bindings into dist/
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            target/wasm32-unknown-unknown/release/ikigai_web_demo.wasm

      # Build the lazy-loaded XSLT module wasm from the ikigai-xslt repo itself, with its
      # `module` feature (which emits the module glue via ikigai_module::wasm_module!) — so
      # xrust never enters the host's wasm; the host imports it lazily through the committed
      # dist/xslt-loader.js glue. Only the generated .js/.wasm are CI-built. Uses the same
      # wasm32 toolchain + wasm-bindgen-cli@0.2.108 installed above. (ikigai-xslt is its own
      # module now — there is no separate ikigai-xslt-module crate.)
      - name: Build XSLT module WASM + JS bindings into dist/
        run: |
          git clone --depth 1 https://github.com/ikigai-rs/ikigai-xslt.git module-src
          cargo build --release --lib --features module \
            --manifest-path module-src/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            module-src/target/wasm32-unknown-unknown/release/ikigai_xslt.wasm

      # The JSON-LD operator module (urn:jsonld:*), built from its own repo with the `module`
      # feature, lazy-loaded via the committed dist/jsonld-loader.js — the heavy json-ld tree
      # kept out of the host wasm, exactly like XSLT.
      - name: Build JSON-LD module WASM + JS bindings into dist/
        run: |
          git clone --depth 1 https://github.com/ikigai-rs/ikigai-jsonld.git jsonld-src
          cargo build --release --lib --features module \
            --manifest-path jsonld-src/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist \
            jsonld-src/target/wasm32-unknown-unknown/release/ikigai_jsonld.wasm

      # Cache-bust the fixed-name host JS + wasm: rewrite the ?v=__BUILD__ placeholder in
      # index.html to this commit's SHA, so every deploy fetches fresh assets instead of a
      # (max-age=600) stale cached copy. The placeholder is harmless locally (a static
      # server ignores the query).
      - name: Stamp cache-busting build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA}/g" dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The same tree, as an ordinary artifact, so the `smoke` job below can RUN it. It
      # is handed over after the stamp so the smoke gate exercises the exact bytes that
      # deploy — not a re-build that might differ.
      - name: Hand dist/ to the smoke gate
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # The gate that RUNS the wasm instead of only compiling it.
  #
  # ci.yml checks fmt, clippy on the wasm lib, and clippy on all native targets. All three
  # are compile-only, and the failure this exists for is invisible to a compiler:
  # ikigai-time 0.1.12 stamped completed jobs with `std::time::Instant::now()`, which
  # compiles clean for wasm32-unknown-unknown and panics at runtime — while holding the
  # job-registry mutex, so every later `urn:time:*` read died `cannot recursively acquire
  # mutex`. `urn:time:jobs` is one of three sub-requests `urn:data:control-cards`
  # composes, so the public demo's Control panel was a bare header from 2026-08-12 to
  # 2026-09-01 with every check green the whole time.
  #
  # It runs on the built artifact rather than in-crate for a reason this workflow makes
  # plain: the deployed tree also contains ~400 lines of hand-written JS glue in
  # index.html (the /k/ fetch interception, the htmx adapter) that no Rust test can reach,
  # and two module wasms built above from `git clone --depth 1` of ikigai-xslt and
  # ikigai-jsonld — unpinned upstream HEAD, which nothing in this repo compiles. Only a
  # test over dist/ sees any of that.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Take the built tree, not the committed one: dist/*.js and dist/*.wasm are
      # gitignored (CI-generated), so the checkout alone has no kernel to run.
      - name: Replace dist/ with the artifact that is about to deploy
        run: rm -rf dist

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smoke/package-lock.json

      - name: Install smoke deps
        working-directory: smoke
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('smoke/package-lock.json') }}

      - name: Install Chromium
        working-directory: smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built demo
        working-directory: smoke
        run: npx playwright test

      # A failure here blocks the deploy, so the trace is the thing that explains why.
      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke/test-results
          retention-days: 7

  deploy:
    # Gated on `smoke`, not just `build`: a tree that compiles but does not RUN never
    # reaches the public URL.
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
