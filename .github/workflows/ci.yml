# PR + push CI for the web-demo. The Pages deploy (pages.yml) only builds the
# wasm LIB, so nothing there compiles the native `ikigai-net-server` bin — a
# published-dep bump can silently desync it and sit red for days. `cargo check
# --all-targets` closes that blind spot; fmt + clippy keep the style debt from
# creeping back now that we've paid it down.
#
# Everything in this file is COMPILE-ONLY, and that is a real ceiling, not a nitpick: on
# 2026-08-12 a dependency bump landed a `std::time::Instant::now()` on the wasm path, which
# compiles clean for wasm32-unknown-unknown and panics at runtime. All three checks below
# stayed green for twenty days while the public demo's Control panel showed a bare header.
# The gate that would have caught it RUNS the artifact and lives in pages.yml (`smoke`,
# sitting between build and deploy); its reasoning is written up in smoke/README.md. If you
# are adding coverage here, check first whether it belongs there instead.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      # The deployed artifact: the wasm lib must be lint-clean.
      - name: clippy (wasm lib)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

      # The blind spot: native lib + the ikigai-net-server bin + tests. This is
      # the target set that would have caught the server.rs capability drift.
      - name: clippy (native, all targets)
        run: cargo clippy --all-targets -- -D warnings
